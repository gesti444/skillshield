[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillshield"
version = "0.1.0"
description = "Offline security scanner for AI agent skills, instructions, and MCP configurations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gesti" }]
keywords = ["ai-security", "mcp", "agents", "prompt-injection", "sarif"]

[project.scripts]
skillshield = "skillshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
